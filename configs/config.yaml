fallback_model: null
daily_spend_cap_usd: 1.0
long_context_model: null
prompts:
  s1_extract: v2
  synthesize_compact: v3

models:
  local_extractor:
    name: "qwen3.8:udiq4_hui"
    serving_name: "qwen38-udiq4-hui-10k"
    base_url: "http://localhost:11434/v1"
    temperature: 0.1
    output_mode: "native"
    think: false
  embedder:
    name: "bge-m3:latest"
    base_url: "http://localhost:11434"
    batch_size: 32
    # Query time keeps the GPU for Qwen and the reranker, so queries encode on the CPU.
    query_options:
      num_gpu: 0
  reranker:
    name: "BAAI/bge-reranker-v2-m3"
    device: "cuda"
    max_length: 512
    batch_size: 16
  macro_synthesizer:
    name: "deepseek/deepseek-v4.1-flash-1017"
    temperature: 0.3
  deep_dive_evaluator:
    name: "deepseek/deepseek-v4.1-flash-1017"
    temperature: 0.4

chunking:
  target_tokens: 450
  overlap_tokens: 60

qdrant:
  url: "http://127.0.0.1:6233"
  collections:
    chunks: "xn_chunks"
    arcs: "xn_arcs"
  dense_size: 1024

retrieval:
  prefetch_k: 40
  fused_k: 30
  top_k: 8
  min_rerank_score: 0.3
