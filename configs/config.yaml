fallback_model: null
daily_spend_cap_usd: 1.0
# OpenRouter provider routing for cloud calls (G-20.1): the fastest provider first.
cloud_provider:
  sort: latency
long_context_model: null
prompts:
  s1_extract: v4
  synthesize_compact: v4

models:
  local_extractor:
    name: "qwen3.8:udiq4_hui"
    serving_name: "qwen38-udiq4-hui-10k"
    base_url: "http://localhost:11434/v1"
    temperature: 0.1
    output_mode: "native"
    think: false
  # G-27.1: S1 runs on qwen3.5; the router, S2, S5 and prefix keep local_extractor.
  # G-30 (owner yes, 2026-11-08): the owner-built Q8_0 MTP model, 10.7 s/chapter vs 16.7.
  s1_extractor:
    name: "qwen3.5_12k:q8_mtp"
    serving_name: "qwen3.5_12k:q8_mtp"
    base_url: "http://localhost:11434/v1"
    temperature: 0.1
    output_mode: "native"
    think: false
  embedder:
    name: "bge-m3:latest"
    base_url: "http://localhost:11434"
    batch_size: 32
    # Query time keeps the GPU for Qwen and the reranker, so queries encode on the CPU.
    query_options:
      num_gpu: 0
  reranker:
    name: "BAAI/bge-reranker-v2-m3"
    device: "cuda"
    max_length: 512
    batch_size: 16
  # G-28 R-3: synthesize caps reasoning, or it can fill the output cap before answering.
  macro_synthesizer:
    name: "deepseek/deepseek-v4.1-flash-1017"
    temperature: 0.3
    reasoning:
      effort: low
  deep_dive_evaluator:
    name: "deepseek/deepseek-v4.1-flash-1017"
    temperature: 0.4
    reasoning:
      effort: low

chunking:
  target_tokens: 450
  overlap_tokens: 60

qdrant:
  url: "http://127.0.0.1:6233"
  collections:
    chunks: "xn_chunks"
    arcs: "xn_arcs"
  dense_size: 1024

retrieval:
  prefetch_k: 40
  fused_k: 30
  top_k: 8
  min_rerank_score: 0.3

# G-27: S1 clean-up step (src/xn/pipeline/s1_postprocess.py).
s1:
  postprocess:
    name_filter: caps-proper+words
    category_fix: true
    dedupe_events: true
