[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xn-agent"
version = "0.1.0"
description = "Analysis agent for long Chinese web novels in Vietnamese translation"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "pydantic-ai>=0.0.18",
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "qdrant-client>=1.9.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "httpx>=0.27.0",
    "rich>=13.7.0",
    "typer>=0.12.0",
    "pyyaml>=6.0.1",
    "numpy>=1.26.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/xn"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
